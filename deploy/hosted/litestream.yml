# Continuous replication of the hosted notebook to Cloud Storage.
#
# Installed to /etc/litestream.yml by deploy/hosted/install_litestream.sh.
# This file holds no secrets: the GCS credential is a separate root-owned
# 0600 JSON key that systemd hands to the unit through LoadCredential=.

# Litestream only uploads when the database actually changed, so an idle
# notebook uploads nothing. 60s is the recovery point objective: at most one
# minute of writing is at risk.
dbs:
  - path: /var/lib/tan-studio/tan-studio.sqlite
    replica:
      url: gs://tan-coffee-backups/tan-studio/notebook
      sync-interval: 60s

# Everything below is housekeeping of remote files, and every housekeeping tick
# costs a Cloud Storage class A operation whether or not there is work to do.
# The stock intervals (L1 30s, L2 5m, L0 retention 15s) idle at roughly 13
# listings a minute, which is 500,000+ operations a month against a free
# allowance of 5,000. These intervals idle at about 50 a day instead. They are
# deliberately long: stretching them costs nothing but a little remote clutter,
# shortening them costs money, and neither affects how much data can be lost.
levels:
  - interval: 1h # L1
  - interval: 6h # L2
  - interval: 24h # L3

l0-retention: 24h
l0-retention-check-interval: 6h

snapshot:
  interval: 24h
  retention: 168h

logging:
  level: info
  type: text
