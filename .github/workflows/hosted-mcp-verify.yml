name: Hosted MCP isolated AMD64 verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: hosted-mcp-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-amd64:
    if: github.head_ref == 'codex/hosted-mcp' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR merge revision without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native AMD64 host
        run: |
          test "$(uname -m)" = x86_64
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Build isolated verification image
        run: docker build --platform linux/amd64 -f deploy/hosted/Dockerfile.verify -t tan-studio-mcp-verify:ci .
      - name: Run fixture-only verification without external networking
        run: docker run --rm --pull never --network none tan-studio-mcp-verify:ci
